[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otforge"
version = "0.2.1"
description = "OT/ICS detection-engineering pipeline: protocol-accurate synthetic telemetry, fuzz-driven discovery, detection synthesis with false-positive validation, and labelled Modbus/TCP capture datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ahmed Hassan" }]
keywords = ["ics", "ot", "modbus", "detection-engineering", "false-positive", "sigma", "threat-detection"]
dependencies = []

[project.scripts]
otforge = "otforge_cli.main:main"

[tool.setuptools.packages.find]
where = ["packages"]
